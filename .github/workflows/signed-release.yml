name: Clinic Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.CLINIC_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CLINIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLINIC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLINIC_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing CLINIC_KEYSTORE_B64" >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing CLINIC_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing CLINIC_KEY_ALIAS" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing CLINIC_KEY_PASSWORD" >&2; exit 1; }
      - name: Materialize signing key
        env:
          KEYSTORE_B64: ${{ secrets.CLINIC_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/clinic-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/clinic-signing/clinic-release.jks"
          chmod 600 "$RUNNER_TEMP/clinic-signing/clinic-release.jks"
      - name: Unit tests and release lint
        run: |
          gradle :app:testDebugUnitTest --stacktrace
          gradle :app:lintRelease --stacktrace
      - name: Build signed release APK
        env:
          CLINIC_KEYSTORE_PATH: ${{ runner.temp }}/clinic-signing/clinic-release.jks
          CLINIC_KEYSTORE_PASSWORD: ${{ secrets.CLINIC_KEYSTORE_PASSWORD }}
          CLINIC_KEY_ALIAS: ${{ secrets.CLINIC_KEY_ALIAS }}
          CLINIC_KEY_PASSWORD: ${{ secrets.CLINIC_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK signature and alignment
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          sha256sum "$APK" > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 30
      - name: Remove signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/clinic-signing"
