name: Clinic Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/release-candidate.yml'

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android release lint
        run: gradle :app:lintRelease --stacktrace
      - name: Build unsigned release candidate
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify release is not debug-signed
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          if "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "Unexpected signed APK in unsigned release-candidate job" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-release-candidate-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
